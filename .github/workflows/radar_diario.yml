name: Radar Concursos Historia

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  varredura:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: pip install requests beautifulsoup4 lxml google-genai pydantic

      - name: Executar Scraper + Filtro IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper_concursos.py

      - name: Atualizar arquivo de historico
        run: |
          if [ -f historico_vagas.json ]; then
            git config --global user.name "Radar Bot"
            git config --global user.email "bot@noreply.github.com"
            git add historico_vagas.json
            git diff --staged --quiet || git commit -m "Atualiza historico de vagas lidas"
            git push
          fi
